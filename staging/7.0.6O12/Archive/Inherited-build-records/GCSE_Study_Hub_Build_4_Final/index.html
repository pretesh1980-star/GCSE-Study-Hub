<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GCSE Study Hub</title>
<style>
:root{--bg:#f5f7ff;--card:#fff;--ink:#172033;--muted:#64708a;--accent:#635bff;--good:#20a36a;--warn:#f59e0b;--bad:#ef4444;--line:#e5e9f2}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{background:linear-gradient(135deg,#5b5df0,#7c3aed);color:#fff;padding:22px 18px 26px;position:sticky;top:0;z-index:5}
.wrap{max-width:1180px;margin:auto}h1{margin:0;font-size:28px}h2{margin:0 0 8px}h3{margin:0 0 6px}p{line-height:1.55}.sub{opacity:.9}
nav{display:flex;gap:8px;overflow:auto;margin-top:18px}nav button{background:rgba(255,255,255,.14);color:#fff;padding:10px 14px;border-radius:12px;white-space:nowrap}
nav button.active{background:#fff;color:#4c46d8}main{padding:22px 18px 60px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(31,41,55,.05)}
.hero{background:linear-gradient(135deg,#fff,#eef0ff);border:1px solid #dfe3ff}.big{font-size:34px;font-weight:800}.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef0ff;color:#4c46d8;font-size:12px;font-weight:700}
.progress{height:10px;background:#e9edf5;border-radius:99px;overflow:hidden}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#5b5df0,#a855f7);width:var(--w)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{padding:10px 13px;border-radius:11px;background:#eef0ff;color:#4338ca;font-weight:700}.btn.primary{background:var(--accent);color:#fff}.btn.good{background:#e7f8f0;color:#087a4e}.btn.dark{background:#20283a;color:#fff}
.hidden{display:none}.topic{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:13px;border-top:1px solid var(--line)}
.topic small{color:var(--muted)}.score{font-weight:800}.question{font-size:19px;font-weight:750;margin:12px 0}.option{display:block;width:100%;text-align:left;background:#f7f8fc;border:1px solid var(--line);padding:12px;border-radius:12px;margin:8px 0}
.option.correct{border-color:var(--good);background:#eafaf3}.option.wrong{border-color:var(--bad);background:#fff0f0}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}select,input{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
.lesson{white-space:pre-wrap}.visual{background:#fbfbff;border:1px dashed #cfd4ff;border-radius:14px;padding:18px;text-align:center;font-size:18px}
footer{max-width:1180px;margin:auto;padding:0 18px 40px;color:var(--muted);font-size:13px}
@media(max-width:650px){h1{font-size:23px}main{padding:16px 12px 50px}.card{padding:15px}}
</style></head>
<body>
<header class="top"><div class="wrap"><h1>🧠 GCSE Study Hub</h1><div class="sub">Learn → Practise → Test → Improve • adaptive study built in</div>
<nav id="nav"></nav></div></header>
<main class="wrap" id="app"></main>
<footer>Curriculum framework is designed around GCSE subject content and assessment objectives used in England. Your exact exam-board specification can be added later.</footer>
<script>
const SUBJECTS = {"Biology": ["Cell Biology", "Organisation", "Infection & Response", "Bioenergetics", "Homeostasis & Response", "Inheritance", "Ecology"], "Chemistry": ["Atomic Structure", "Bonding", "Quantitative Chemistry", "Chemical Changes", "Energy Changes", "Organic Chemistry", "Chemical Analysis", "Chemistry of the Atmosphere", "Using Resources"], "Physics": ["Energy", "Electricity", "Particle Model", "Atomic Structure", "Forces", "Waves", "Magnetism & Electromagnetism", "Space Physics"], "Maths": ["Number", "Algebra", "Ratio & Proportion", "Geometry", "Probability", "Statistics", "Graphs", "Vectors"], "English Language": ["Reading Skills", "Language Analysis", "Creative Writing", "Non-fiction", "Persuasive Writing", "Accuracy"], "English Literature": ["Shakespeare", "19th Century Text", "Modern Text", "Poetry", "Themes & Characters", "Context & Comparison"], "Geography": ["Natural Hazards", "The Living World", "Physical Landscapes", "Urban Issues", "Changing Economic World", "Resource Management", "Fieldwork & Geographical Skills"], "History": ["Medicine Through Time", "Elizabethan England", "Conflict & Tension", "Period Study", "Source Skills", "Interpretations"], "French": ["Identity", "Free Time", "School", "Future Plans", "Local Area", "Global Issues", "Grammar", "Speaking & Listening"]};
const LESSONS = {"Biology": {"Cell Biology": {"learn": "Cells are the basic units of living organisms. Animal cells contain a nucleus, cytoplasm, cell membrane and mitochondria. Plant cells also have a cell wall, chloroplasts and a large permanent vacuole.", "key": ["nucleus", "cytoplasm", "cell membrane", "mitochondria", "chloroplast", "cell wall", "vacuole"], "visual": "Compare an animal cell and a plant cell. Label each organelle and add one short job for each.", "challenge": "Explain why a plant cell needs chloroplasts but an animal cell does not."}, "Organisation": {"learn": "Cells are organised into tissues, tissues into organs, and organs into organ systems. Digestion is an example of several organs working together.", "key": ["tissue", "organ", "organ system", "digestive system"], "visual": "Build a ladder: cell \u2192 tissue \u2192 organ \u2192 organ system.", "challenge": "Explain how organisation helps the body carry out a complex job."}, "Infection & Response": {"learn": "Pathogens can cause disease. The body uses barriers, white blood cells and other defences to reduce infection. Vaccination trains the immune system to respond to a pathogen.", "key": ["pathogen", "bacteria", "virus", "antibody", "vaccine"], "visual": "Show a pathogen meeting three layers of defence.", "challenge": "Explain how vaccination can reduce the chance of becoming seriously ill."}, "Bioenergetics": {"learn": "Photosynthesis transfers light energy into chemical energy stored in glucose. Respiration releases energy from glucose for cell processes.", "key": ["photosynthesis", "respiration", "glucose", "chlorophyll"], "visual": "Use arrows: light \u2192 chlorophyll \u2192 glucose; glucose + oxygen \u2192 energy.", "challenge": "Compare photosynthesis and aerobic respiration."}, "Homeostasis & Response": {"learn": "Homeostasis keeps internal conditions within suitable limits. The nervous system and hormones help coordinate responses.", "key": ["homeostasis", "stimulus", "receptor", "hormone"], "visual": "Stimulus \u2192 receptor \u2192 coordination centre \u2192 effector \u2192 response.", "challenge": "Explain why stable internal conditions are important for enzymes."}, "Inheritance": {"learn": "Genetic information is carried by DNA. Genes are sections of DNA and alleles are different versions of a gene. Inheritance can be represented with genetic diagrams.", "key": ["DNA", "gene", "allele", "chromosome", "genotype", "phenotype"], "visual": "Chromosome \u2192 DNA \u2192 gene \u2192 allele.", "challenge": "Use a simple genetic cross to predict possible offspring."}, "Ecology": {"learn": "Ecology studies how organisms interact with each other and their environment. Food chains show feeding relationships and energy transfer.", "key": ["ecosystem", "population", "community", "food chain", "biodiversity"], "visual": "Producer \u2192 primary consumer \u2192 secondary consumer \u2192 decomposer.", "challenge": "Explain one way a change in a population can affect an ecosystem."}}, "Chemistry": {"Atomic Structure": {"learn": "Atoms contain protons, neutrons and electrons. The number of protons identifies the element. Isotopes have the same number of protons but different numbers of neutrons.", "key": ["proton", "neutron", "electron", "isotope", "element"], "visual": "Draw a nucleus with protons/neutrons and electrons in shells.", "challenge": "Explain why two isotopes are still the same element."}, "Bonding": {"learn": "Ionic bonding involves electron transfer between oppositely charged ions. Covalent bonding involves sharing pairs of electrons. Metallic bonding has positive ions and delocalised electrons.", "key": ["ionic", "covalent", "metallic", "ion", "electron"], "visual": "Show one electron-transfer diagram and one shared-electron diagram.", "challenge": "Link bonding type to a material property."}, "Quantitative Chemistry": {"learn": "Chemists use equations and relative formula mass to calculate amounts of substances. Balanced equations show the same number of each atom on both sides.", "key": ["relative formula mass", "mole", "concentration", "balanced equation"], "visual": "Mass \u2192 moles \u2192 equation ratio \u2192 required amount.", "challenge": "Set up a calculation from a balanced equation."}, "Chemical Changes": {"learn": "Acids react with bases, metals and some carbonates. Electrolysis uses electricity to break down ionic substances.", "key": ["acid", "alkali", "neutralisation", "electrolysis", "ion"], "visual": "Acid + base \u2192 salt + water.", "challenge": "Explain what happens to ions during electrolysis."}, "Energy Changes": {"learn": "Some reactions transfer energy to the surroundings and others take energy from the surroundings. Reaction profiles can show energy changes.", "key": ["exothermic", "endothermic", "activation energy", "reaction profile"], "visual": "Plot reactants, activation energy peak and products.", "challenge": "Use a reaction profile to identify an exothermic reaction."}, "Organic Chemistry": {"learn": "Organic chemistry includes compounds based on carbon. Hydrocarbons include alkanes and alkenes; crude oil can be separated into fractions.", "key": ["hydrocarbon", "alkane", "alkene", "fraction", "cracking"], "visual": "Crude oil \u2192 fractional distillation \u2192 fractions.", "challenge": "Explain why cracking is useful."}, "Chemical Analysis": {"learn": "Chemists use tests to identify ions and gases. Chromatography can separate mixtures and help identify substances.", "key": ["chromatography", "chromatogram", "ion", "test"], "visual": "Draw a chromatogram with a baseline and separated spots.", "challenge": "Explain how chromatography can show that a sample contains more than one substance."}, "Chemistry of the Atmosphere": {"learn": "Earth's atmosphere has changed over time. Human activities can change greenhouse gas levels and air pollution.", "key": ["greenhouse gas", "carbon dioxide", "methane", "pollutant"], "visual": "Atmosphere timeline from early Earth to today.", "challenge": "Compare one natural and one human influence on atmospheric composition."}, "Using Resources": {"learn": "Chemists consider how materials are extracted, used, recycled and replaced. Life-cycle thinking considers impacts across a product's life.", "key": ["resource", "recycling", "life cycle", "sustainability"], "visual": "Raw material \u2192 manufacture \u2192 use \u2192 reuse/recycle.", "challenge": "Evaluate one advantage and one limitation of recycling a material."}}, "Physics": {"Energy": {"learn": "Energy can be stored and transferred between stores. Power describes the rate of energy transfer.", "key": ["energy store", "transfer", "power", "efficiency"], "visual": "Show energy-store arrows for a moving object.", "challenge": "Explain the difference between energy and power."}, "Electricity": {"learn": "Current is the rate of flow of charge. Potential difference is energy transferred per unit charge. Resistance affects current.", "key": ["current", "potential difference", "resistance", "charge"], "visual": "Simple circuit with cell, resistor, ammeter and voltmeter.", "challenge": "Predict what happens to current when resistance increases at constant potential difference."}, "Particle Model": {"learn": "Matter is made of particles. Temperature relates to particle energy, and changes of state involve changes in energy and arrangement.", "key": ["particle", "density", "melting", "boiling", "internal energy"], "visual": "Particle diagrams for solid, liquid and gas.", "challenge": "Explain why a gas is easy to compress."}, "Atomic Structure": {"learn": "Atoms have a tiny nucleus containing protons and neutrons, with electrons around it. Radiation comes from unstable nuclei.", "key": ["nucleus", "isotope", "alpha", "beta", "gamma", "half-life"], "visual": "Compare alpha, beta and gamma using simple symbols and penetration arrows.", "challenge": "Choose a suitable type of radiation for a named application and explain why."}, "Forces": {"learn": "Forces can change motion or shape. Resultant force determines acceleration. Momentum links mass and velocity.", "key": ["force", "resultant", "acceleration", "momentum"], "visual": "Free-body diagram with balanced and unbalanced forces.", "challenge": "Explain why an object can move at constant speed when forces act on it."}, "Waves": {"learn": "Waves transfer energy. Transverse waves oscillate perpendicular to travel; longitudinal waves oscillate parallel to travel.", "key": ["wavelength", "frequency", "amplitude", "transverse", "longitudinal"], "visual": "Label wavelength and amplitude on a wave.", "challenge": "Relate frequency and wavelength to wave speed."}, "Magnetism & Electromagnetism": {"learn": "Magnetic fields surround magnets and current-carrying wires. Electromagnets are useful because their strength can be changed.", "key": ["magnetic field", "electromagnet", "motor", "generator"], "visual": "Field lines around a bar magnet and a simple coil.", "challenge": "Give two ways to make an electromagnet stronger."}, "Space Physics": {"learn": "Gravity keeps planets and moons in orbit. Stars form, change and eventually reach different stages depending on their mass.", "key": ["orbit", "gravity", "star", "red giant", "supernova"], "visual": "Simple life cycle of a Sun-like star.", "challenge": "Explain why planets stay in orbit instead of flying away in a straight line."}}, "Maths": {"Number": {"learn": "Number skills include fractions, percentages, powers, standard form and exact calculations.", "key": ["fraction", "percentage", "index", "standard form", "surds"], "visual": "Use a number line and place common fractions and percentages on it.", "challenge": "Solve a multi-step percentage problem and check your answer."}, "Algebra": {"learn": "Algebra uses letters to represent numbers. You can simplify, expand, factorise and solve equations.", "key": ["expression", "equation", "factorise", "coefficient", "quadratic"], "visual": "Show algebra tiles for x\u00b2, x and constants.", "challenge": "Solve a quadratic equation and explain each step."}, "Ratio & Proportion": {"learn": "Ratios compare quantities. Proportion describes how quantities change together.", "key": ["ratio", "scale factor", "direct proportion", "inverse proportion"], "visual": "Bar models for equivalent ratios.", "challenge": "Solve a scale or proportion problem and justify the method."}, "Geometry": {"learn": "Geometry uses properties of shapes, angles, circles, transformations and measures.", "key": ["angle", "similar", "congruent", "circle", "vector"], "visual": "Angle facts map: straight line, triangle, quadrilateral, parallel lines.", "challenge": "Combine two geometry facts in a proof-style question."}, "Probability": {"learn": "Probability measures how likely an event is. Probabilities range from 0 to 1 and can be combined using appropriate rules.", "key": ["probability", "outcome", "sample space", "independent"], "visual": "Probability scale from impossible to certain.", "challenge": "Use a tree diagram for a two-step event."}, "Statistics": {"learn": "Statistics summarises and compares data using averages, spread and graphs.", "key": ["mean", "median", "mode", "range", "scatter graph"], "visual": "Box plot with median and quartiles labelled.", "challenge": "Choose a suitable average and justify your choice."}, "Graphs": {"learn": "Graphs show relationships between variables. Gradients and intercepts can describe linear relationships.", "key": ["gradient", "intercept", "quadratic", "exponential"], "visual": "Coordinate grid with a line and its gradient triangle.", "challenge": "Interpret the meaning of a gradient in context."}, "Vectors": {"learn": "Vectors describe movement with direction and magnitude. They can be added, subtracted and multiplied by scalars.", "key": ["vector", "magnitude", "scalar", "column vector"], "visual": "Arrows showing vector addition head-to-tail.", "challenge": "Use vectors to prove a geometric relationship."}}};
const QUESTIONS = [{"subject": "Biology", "topic": "Cell Biology", "type": "mcq", "q": "Which structure controls the activities of an animal cell?", "options": ["Nucleus", "Cell wall", "Chloroplast", "Vacuole"], "answer": "Nucleus", "explain": "The nucleus contains genetic material and helps control cell activities.", "level": 1}, {"subject": "Biology", "topic": "Infection & Response", "type": "mcq", "q": "What is a pathogen?", "options": ["A disease-causing microorganism", "A type of antibody", "A body organ", "A vitamin"], "answer": "A disease-causing microorganism", "explain": "Pathogens are microorganisms that can cause disease.", "level": 1}, {"subject": "Chemistry", "topic": "Atomic Structure", "type": "mcq", "q": "Which particle has a negative charge?", "options": ["Proton", "Neutron", "Electron", "Nucleus"], "answer": "Electron", "explain": "Electrons have negative charge.", "level": 1}, {"subject": "Chemistry", "topic": "Bonding", "type": "mcq", "q": "What happens in covalent bonding?", "options": ["Electrons are shared", "Protons are shared", "Neutrons are transferred", "Nuclei combine"], "answer": "Electrons are shared", "explain": "Covalent bonds form when atoms share pairs of electrons.", "level": 1}, {"subject": "Physics", "topic": "Electricity", "type": "mcq", "q": "Which quantity is measured in amperes?", "options": ["Current", "Energy", "Resistance", "Power"], "answer": "Current", "explain": "Current is measured in amperes (A).", "level": 1}, {"subject": "Physics", "topic": "Forces", "type": "mcq", "q": "What does a resultant force of zero mean?", "options": ["The object must be stopped", "There is no change in velocity", "The object has no mass", "Gravity is absent"], "answer": "There is no change in velocity", "explain": "Zero resultant force means no acceleration, so velocity stays constant.", "level": 2}, {"subject": "Maths", "topic": "Algebra", "type": "short", "q": "Simplify: 3x + 5x.", "answer": "8x", "explain": "Add the coefficients: 3 + 5 = 8.", "level": 1}, {"subject": "Maths", "topic": "Probability", "type": "short", "q": "A fair coin is tossed once. What is the probability of heads?", "answer": "1/2", "explain": "There are two equally likely outcomes, so heads has probability 1/2.", "level": 1}, {"subject": "English Language", "topic": "Language Analysis", "type": "writing", "q": "In one or two sentences, explain how a writer could create tension without using the word 'scared'.", "answer": "Use precise vocabulary, short sentences, sensory detail, or withheld information.", "explain": "Strong answers explain a technique and its effect.", "level": 2}, {"subject": "Geography", "topic": "Natural Hazards", "type": "writing", "q": "Give one reason why the impacts of a natural hazard can vary between places.", "answer": "Differences in wealth, preparedness, population density, infrastructure or governance can change vulnerability.", "explain": "The key is to link a factor to the level of risk or impact.", "level": 2}];
const TESTS = {"Biology|Cell Biology": [["Define a cell.", 2], ["Name two structures found in plant cells but not animal cells.", 2], ["Explain one difference between a plant cell and an animal cell.", 3], ["A cell is viewed using a microscope. Explain why magnification can help a student study cell structures.", 4]], "Chemistry|Atomic Structure": [["Name the three subatomic particles.", 3], ["State the charge of an electron.", 1], ["Explain why isotopes of an element have the same chemical properties.", 3], ["An atom has 11 protons. Explain what this tells you about the element and its electrons if the atom is neutral.", 4]], "Physics|Electricity": [["What is electric current?", 2], ["State the unit of resistance.", 1], ["Explain what happens to current if resistance increases while potential difference stays constant.", 3], ["Describe how you would use an ammeter and voltmeter to investigate a resistor in a simple circuit.", 4]], "Maths|Algebra": [["Simplify 4x + 7x.", 1], ["Expand 3(x + 2).", 2], ["Solve 2x + 5 = 17.", 2], ["Explain how you would check your solution to an equation.", 3]]};
const KEY='gcseStudyHubV3';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{page:'home',subject:null,topic:null,mastery:{},correct:0,attempts:0,streak:0,examBoard:'Not set yet',last:''};
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function mastery(s,t){return state.mastery[s+'|'+t]||0}
function status(x){return x>=85?'🟢 Secure':x>=65?'🟡 Developing':x>=40?'🟠 Needs practice':'🔴 Priority'}
function setPage(p){state.page=p;save();render()}
function nav(){let items=[['home','Home'],['subjects','Subjects'],['quiz','Adaptive Quiz'],['tests','Module Tests'],['progress','Progress'],['dentist','Dentist Path'],['settings','Settings']];document.getElementById('nav').innerHTML=items.map(x=>`<button class="${state.page==x[0]?'active':''}" onclick="setPage('${x[0]}')">${x[1]}</button>`).join('')}
function render(){nav();let a=document.getElementById('app');({home,subjects,quiz,testsPage,progress,dentist,settings}[state.page]||home)(a)}
function home(a){let all=Object.values(state.mastery), avg=all.length?Math.round(all.reduce((x,y)=>x+y,0)/all.length):0; a.innerHTML=`
<section class="card hero"><span class="pill">TODAY'S MISSION</span><h2 style="margin-top:10px">Make one weak topic stronger.</h2><p>Start with a short adaptive quiz. The app uses your answers to choose what you practise next.</p><div class="actions"><button class="btn primary" onclick="setPage('quiz')">Start adaptive quiz</button><button class="btn" onclick="setPage('subjects')">Browse subjects</button></div></section>
<div class="grid" style="margin-top:14px">
<div class="card"><div class="muted">Overall mastery</div><div class="big">${avg}%</div><div class="progress"><i style="--w:${avg}%"></i></div></div>
<div class="card"><div class="muted">Quiz accuracy</div><div class="big">${state.attempts?Math.round(state.correct/state.attempts*100):0}%</div><div class="muted">${state.correct} correct from ${state.attempts} attempts</div></div>
<div class="card"><div class="muted">Exam board</div><div class="big" style="font-size:22px">${state.examBoard}</div><div class="muted">Change later in Settings.</div></div>
</div>
<div class="card" style="margin-top:14px"><h2>How it adapts</h2><div class="grid"><div><b>1. Diagnose</b><p class="muted">Questions begin at an appropriate level.</p></div><div><b>2. Target</b><p class="muted">Weak topics appear more often.</p></div><div><b>3. Stretch</b><p class="muted">Strong answers unlock harder application questions.</p></div><div><b>4. Fix mistakes</b><p class="muted">Reteach → retry → update mastery.</p></div></div></div>`}
function subjects(a){a.innerHTML=`<div class="grid">${Object.entries(SUBJECTS).map(([s,ts])=>`<div class="card"><span class="pill">${ts.length} modules</span><h2 style="margin-top:9px">${s}</h2>${ts.map(t=>`<div class="topic"><div><b>${t}</b><br><small>${status(mastery(s,t))} • ${mastery(s,t)}%</small></div><div class="actions"><button class="btn" onclick="openLesson('${s}','${t}')">Learn</button><button class="btn primary" onclick="startQuiz('${s}','${t}')">Practise</button></div></div>`).join('')}</div></div>`).join('')}`}
function openLesson(s,t){state.page='lesson';state.subject=s;state.topic=t;save();lesson(document.getElementById('app'))}
function lesson(a){let s=state.subject,t=state.topic,l=LESSONS[s]?.[t]||{learn:'Content coming in the next curriculum pack.',key:[],visual:'Visual coming soon.',challenge:'Try explaining the idea in your own words.'};a.innerHTML=`<button class="btn" onclick="setPage('subjects')">← Back</button><section class="card" style="margin-top:12px"><span class="pill">${s} • ${t}</span><h2 style="margin-top:10px">Learn</h2><p class="lesson">${l.learn}</p><h3>🔑 Key words</h3><p>${l.key.map(x=>`<span class="pill" style="margin:3px">${x}</span>`).join(' ')}</p><h3>🖼️ Visualise it</h3><div class="visual">${l.visual}</div><h3 style="margin-top:18px">⭐ Grade 8/9 challenge</h3><p>${l.challenge}</p><div class="actions"><button class="btn primary" onclick="startQuiz('${s}','${t}')">Practise this topic</button><button class="btn dark" onclick="startTest('${s}','${t}')">Take module test</button></div></section>`}
let quizPool=[],quizIndex=0,quizScore=0,quizLength=8,quizMode='adaptive';
function quiz(a){
a.innerHTML=`<section class="card hero"><h2>Adaptive Quiz</h2>
<p class="muted">Choose how much you want to practise. Weak topics are prioritised.</p>
<div class="actions">
<button class="btn" onclick="quizLength=5;quizMode='adaptive';quiz(document.getElementById('app'))">5 questions</button>
<button class="btn primary" onclick="quizLength=8;quizMode='adaptive';quiz(document.getElementById('app'))">8 questions</button>
<button class="btn" onclick="quizLength=12;quizMode='adaptive';quiz(document.getElementById('app'))">12 questions</button>
<button class="btn" onclick="quizMode='mistakes';quiz(document.getElementById('app'))">Fix my mistakes</button>
</div>
<div class="actions"><button class="btn primary" onclick="startQuiz()">Start session</button></div>
</section>
<section class="card" style="margin-top:14px"><h3>How the adaptive system works</h3>
<p class="muted">Correct answers increase topic mastery. Incorrect answers lower mastery so the topic returns more often. Stronger topics are used for harder practice.</p></section>`;
}
function startQuiz(s,t){
let pool=QUESTIONS.filter(q=>!s||q.subject==s).filter(q=>!t||q.topic==t);
if(quizMode==='mistakes') pool=pool.filter(q=>(state.mastery[q.subject+'|'+q.topic]||0)<65);
if(!pool.length) pool=QUESTIONS;
pool=pool.slice().sort((a,b)=>{
let am=state.mastery[a.subject+'|'+a.topic]||0,bm=state.mastery[b.subject+'|'+b.topic]||0;
return (am-bm)+(Math.random()-.5)*8;
});
quizPool=pool.slice(0,quizLength);
quizIndex=0;quizScore=0;state.page='quiz';save();renderQuiz()
}
function renderQuiz(){let a=document.getElementById('app');if(quizIndex>=quizPool.length){a.innerHTML=`<section class="card hero"><h2>Quiz complete 🎉</h2><div class="big">${quizScore} / ${quizPool.length}</div><p>Next time, the adaptive system will prioritise topics that need more practice.</p><button class="btn primary" onclick="setPage('progress')">View progress</button></section>`;return}let q=quizPool[quizIndex];a.innerHTML=`<section class="card"><span class="pill">Question ${quizIndex+1} of ${quizPool.length}</span><div class="question">${q.q}</div>${q.options?q.options.map(o=>`<button class="option" onclick="answer(this,${JSON.stringify(o)},${JSON.stringify(q.answer)})">${o}</button>`).join(''):`<input id="ans" placeholder="Type your answer"><div class="actions"><button class="btn primary" onclick="shortAnswer()">Check answer</button></div>`}<div id="feedback"></div></section>`}
function answer(btn,chosen,correct){let q=quizPool[quizIndex],ok=chosen===correct;state.attempts++;if(ok){state.correct++;quizScore++}updateMastery(q,ok);document.querySelectorAll('.option').forEach(b=>b.disabled=true);btn.classList.add(ok?'correct':'wrong');document.getElementById('feedback').innerHTML=`<div class="card" style="margin-top:12px"><b>${ok?'Correct! 🎉':'Not quite yet.'}</b><p>${q.explain}</p><button class="btn primary" onclick="quizNext()">Next</button></div>`;save()}
function shortAnswer(){let q=quizPool[quizIndex],v=document.getElementById('ans').value.trim().toLowerCase(),ok=v && (v===q.answer.toLowerCase()||q.answer.toLowerCase().includes(v));state.attempts++;if(ok){state.correct++;quizScore++}updateMastery(q,ok);document.getElementById('feedback').innerHTML=`<div class="card" style="margin-top:12px"><b>${ok?'Correct! 🎉':'Keep practising.'}</b><p>Answer: <b>${q.answer}</b></p><p>${q.explain}</p><button class="btn primary" onclick="quizNext()">Next</button></div>`;save()}
function updateMastery(q,ok){let k=q.subject+'|'+q.topic,old=state.mastery[k]||0;state.mastery[k]=Math.max(0,Math.min(100,Math.round(old+(ok?12:-10))));}
function quizNext(){quizIndex++;renderQuiz()}
function testsPage(a){a.innerHTML=`<section class="card"><h2>End-of-module tests</h2><p class="muted">Written tests are designed to check recall, understanding and application. Type your answers and submit for a practice score.</p></section><div class="grid" style="margin-top:14px">${Object.keys(TESTS).map(k=>{let [s,t]=k.split('|');return `<div class="card"><span class="pill">${s}</span><h3>${t}</h3><p class="muted">${TESTS[k].length} questions • mixed difficulty</p><button class="btn primary" onclick="startTest('${s}','${t}')">Start test</button></div>`}).join('')}</div>`}
let currentTest=[];
function startTest(s,t){currentTest=TESTS[s+'|'+t]||[];state.page='test';state.subject=s;state.topic=t;save();renderTest()}
function renderTest(){let a=document.getElementById('app');a.innerHTML=`<button class="btn" onclick="setPage('tests')">← Tests</button><section class="card" style="margin-top:12px"><span class="pill">${state.subject} • ${state.topic}</span><h2 style="margin-top:10px">Module Test</h2><p>Answer in your own words. This prototype gives feedback using key ideas; exact mark schemes will be attached when your exam board is selected.</p>${currentTest.map((x,i)=>`<div style="margin-top:18px"><b>${i+1}. ${x[0]}</b><textarea id="t${i}" placeholder="Write your answer..."></textarea><small class="muted">Marks available: ${x[1]}</small></div>`).join('')}<div class="actions"><button class="btn primary" onclick="submitTest()">Submit test</button></div><div id="testResult"></div></section>`}
function submitTest(){let answered=currentTest.reduce((n,x,i)=>n+(document.getElementById('t'+i).value.trim()?1:0),0);let max=currentTest.reduce((n,x)=>n+x[1],0);let score=Math.round(answered/max*100);let k=state.subject+'|'+state.topic;state.mastery[k]=Math.max(state.mastery[k]||0,score);save();document.getElementById('testResult').innerHTML=`<div class="card" style="margin-top:18px"><h3>Practice result: ${score}%</h3><p>This first build checks whether you attempted each response. The next marking engine will assess the actual content of each answer against question-specific mark points.</p><button class="btn" onclick="setPage('progress')">Update progress</button></div>`}
function progress(a){let rows=[];Object.entries(SUBJECTS).forEach(([s,ts])=>ts.forEach(t=>rows.push([s,t,mastery(s,t)])));rows.sort((a,b)=>a[2]-b[2]);a.innerHTML=`<section class="card hero"><h2>Progress centre</h2><p>Green = secure, yellow = developing, orange = needs practice, red = priority.</p><div class="grid">${['Recall','Application','Analysis','Calculation','Extended Writing','Exam Technique'].map(x=>`<div class="card"><b>${x}</b><p class="muted">Tracked as you practise.</p><div class="progress"><i style="--w:${Math.min(100,Math.max(5,(state.attempts?state.correct/state.attempts*100:10)))}%"></i></div></div>`).join('')}</div></section><section class="card" style="margin-top:14px"><h2>Weakest topics first</h2>${rows.slice(0,18).map(r=>`<div class="topic"><div><b>${r[0]} — ${r[1]}</b><br><small>${status(r[2])}</small></div><div class="score">${r[2]}%</div></div>`).join('')}</section>`}
function dentist(a){a.innerHTML=`<section class="card hero"><span class="pill">DENTIST PATH</span><h2>Build the foundations for dentistry 🦷</h2><p>This area connects GCSE learning with useful academic skills: strong science knowledge, careful calculations, problem solving, clear explanations and evidence-based thinking.</p></section><div class="grid" style="margin-top:14px">${[['Biology','Cells, organisation, infection, homeostasis and inheritance'],['Chemistry','Atoms, bonding, reactions, calculations and analysis'],['Maths','Algebra, ratio, statistics and accurate calculations'],['English','Clear explanations, analysis and communication'],['Science skills','Data, practical thinking, evaluation and conclusions']].map(x=>`<div class="card"><h3>${x[0]}</h3><p class="muted">${x[1]}</p></div>`).join('')}</div>`}
function settings(a){a.innerHTML=`<section class="card"><h2>Settings</h2><p class="muted">You can add your exam board later without rebuilding the app.</p><label>Exam board</label><select id="board"><option>Not set yet</option><option>AQA</option><option>Pearson Edexcel</option><option>OCR</option><option>WJEC Eduqas</option></select><div class="actions"><button class="btn primary" onclick="state.examBoard=document.getElementById('board').value;save();render()">Save</button><button class="btn" onclick="localStorage.removeItem(KEY);location.reload()">Reset progress</button></div></section>`;document.getElementById('board').value=state.examBoard}
render();
</script></body></html>
