<!doctype html><meta charset="utf-8"><title>O9 native browser verification</title><button id="run">Run O9 browser checks</button><pre id="result">Ready. Separate QA origin; saves restored afterwards.</pre><iframe id="preview" src="../index.html#cell-biology/osmosis" width="390" height="844"></iframe><script>
const f=document.getElementById('preview'),out=document.getElementById('result');
document.getElementById('run').onclick=async()=>{const w=f.contentWindow,rows=[],before=new Map(Object.keys(w.localStorage).map(k=>[k,w.localStorage.getItem(k)])),errors=[];let d=w.document;w.addEventListener('error',e=>errors.push(e.message));const check=(name,ok)=>rows.push({name,pass:!!ok}),wait=()=>new Promise(r=>setTimeout(r,50)),click=s=>d.querySelector(s).click(),input=(id,value)=>{const el=d.getElementById(id);el.value=value;el.dispatchEvent(new w.Event('input',{bubbles:true}));},fill=()=>w.o9Questions(w.o9Data().check.form).forEach(q=>{if(q.numeric)input('input-'+q.id,String(q.answer));else for(const a of q.multi?q.answer:[q.answer])d.getElementById('question-'+q.id).querySelectorAll('input')[q.options.indexOf(a)].click();});
try{
 w.setPage('home');w.changeChoice('Biology','board','aqa');w.changeChoice('Biology','tier','higher');w.changeScienceCourse('trilogy');w.openLesson('Biology','Cell Biology');w.o9ResetEvidence(w.record('Biology'));const reset=d.createElement('script');reset.textContent="ot={stage:0,resumeStage:0,answers:{},repairs:{},results:{},mode:'immediate'};";d.head.append(reset);w.otSave();w.cellJourneyOpenCard('osmosis');check('direct O9 opens original six-stage Lab',d.body.textContent.includes('Stage 1 of 6'));check('discovery and video present at entrance',d.body.textContent.includes('What could make a raisin grow?')&&!!d.querySelector('video')&&d.body.textContent.includes('dynamic equilibrium'));
 input('pre','Water comes from the glass');click('button[onclick="o9RevealExplanation()"]');check('saved prediction beside concise model answer',d.getElementById('o9-raisin-answer').textContent.includes('Water comes from the glass')&&d.getElementById('o9-raisin-answer').textContent.includes('not making new cells'));check('reveal earns no attempts or mastery',w.record('Biology').attempts===0&&w.cellJourneyEvidence('osmosis').score===null);click('button[onclick="o9SoakRaisin()"]');check('soaked illustration has accessible membrane description',d.querySelector('#raisin-desc').textContent.includes('both directions'));input('pre','Updated prediction');check('comparison follows saved edits',d.getElementById('o9-saved-prediction').textContent==='Updated prediction');for(const width of [320,390,768,1365]){f.width=width;await wait();check('raisin comparison no overflow '+width,d.documentElement.scrollWidth<=d.documentElement.clientWidth+1);}input('pre','');click('button[onclick="o9RevealExplanation()"]');check('blank reveal offers gentle guidance',d.getElementById('o9-raisin-answer').textContent.includes('No prediction yet'));input('pre','Water crosses a membrane');click('button[onclick="otNext()"]');check('native click advances original stage',d.body.textContent.includes('Stage 2 of 6'));const video=d.querySelector('video');check('optional video inline with no autoplay',video.hasAttribute('playsinline')&&!video.autoplay&&video.preload==='none');check('transcript link exists',!!d.querySelector('a[href="media/osmosis-narrated-transcript.txt"]'));
 for(const v of [0,2,4]){input('ot-concentration',v);check('membrane direction '+v,d.getElementById('ot-model').textContent.includes(v===2?'No net movement':v>2?'left → right':'right → left'));}
 click('button[onclick="o9TeachCellAnimate()"]');check('single cell demonstration needs no prediction',d.getElementById('o9-cell-demonstration-explanation').textContent.includes('becomes firm'));
 for(const v of ['dilute','equal','concentrated']){click(`button[onclick="o9CellChoose('${v}')"]`);check('cell scenario '+v,d.getElementById('o9-cell-demonstration-explanation').textContent.includes(v==='dilute'?'turgid':v==='equal'?'no overall gain or loss':'plasmolysis'));check('accessible cell description '+v,!!d.querySelector('svg[aria-labelledby="o9-demo-title o9-demo-desc"]'));}
 const graphStage=d.createElement('script');graphStage.textContent="ot.stage=2;otRender();";d.head.append(graphStage);
 for(const v of [10,0,-10]){click(`button[onclick="o9GraphShow(${v})"]`);check('mass example '+v,d.getElementById('o9-graph-story').textContent.includes((10+v/10)+' g'));}
 check('five measured points and one estimated crossing',d.querySelectorAll('.o9-graph svg [role="button"]').length===6);
 for(const point of d.querySelectorAll('.o9-graph svg [role="button"]')){point.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Enter',bubbles:true}));check('keyboard graph point '+point.getAttribute('aria-label'),d.getElementById('o9-graph-story').textContent.includes('Selected sugar concentration'));}
 check('zero crossing explicitly no net movement',d.getElementById('o9-graph-story').textContent.includes('no NET movement'));
 for(const width of [320,390,768,1365]){f.width=width;await wait();check('teaching no overflow '+width,d.documentElement.scrollWidth<=d.documentElement.clientWidth+1);}
 const beforeAttempts=w.record('Biology').attempts;check('guided exploration earns no mastery',w.cellJourneyEvidence('osmosis').score===null);w.o9CheckStart();check('pending hides teaching',!d.querySelector('video')&&!d.querySelector('.o9-cells'));click('button[onclick="o9CheckSubmit()"]');check('missing answers cannot submit',!w.o9Data().check.done&&d.getElementById('o9-check-notice').textContent.includes('attention'));fill();check('native inputs update count',d.getElementById('o9-check-count').textContent.includes('12 of 12'));const originalTopic=w.mastery('Biology','Cell Biology');
 for(const width of [320,390,768,1365]){f.width=width;await wait();check('assessment no overflow '+width,d.documentElement.scrollWidth<=d.documentElement.clientWidth+1);check('numeric touch size '+width,d.querySelector('input[type=text]').getBoundingClientRect().height>=44);}
 check('radio groups have legends',Array.from(d.querySelectorAll('fieldset')).every(el=>el.querySelector('legend')&&el.id));click('button[onclick="o9CheckSubmit()"]');check('native independent submit scores 100',w.cellJourneyEvidence('osmosis').score===100);check('topic mastery unchanged',w.mastery('Biology','Cell Biology')===originalTopic);w.o9CheckSubmit();check('duplicate submit cannot rescore',w.record('Biology').attempts===beforeAttempts+12);
 click('button[onclick="o9CheckStart()"]');fill();w.save();const checkBefore=JSON.stringify(w.o9Data().check);await new Promise(r=>{f.onload=r;f.src='../index.html?o9-reload=1#cell-biology/osmosis-lab';});d=w.document;w.addEventListener('error',e=>errors.push(e.message));check('reload preserves independent pending attempt',JSON.stringify(w.o9Data().check)===checkBefore&&!w.o9Data().check.assisted);w.o9CheckSubmit();check('second form scores independently',w.o9Data().check.score===100);w.o9CheckStart();fill();w.o9CheckSubmit();check('third form is unscored repeat',w.o9Data().check.practiceOnly&&w.record('Biology').attempts===beforeAttempts+24);
 w.o9CheckBack();w.changeChoice('Biology','tier','foundation');w.openLesson('Biology','Cell Biology');w.cellJourneyOpenCard('osmosis');check('Foundation evidence separate',w.cellJourneyEvidence('osmosis').score===null);check('Foundation tests core cell loss',!w.o9Questions(0)[7].q.includes('plasmolys'));w.o9CheckStart();fill();w.o9CheckBack();w.o9CheckStart();w.o9CheckSubmit();check('assisted check cannot score',w.o9Data().check.practiceOnly&&w.cellJourneyEvidence('osmosis').score===null);
 w.cellJourneyLibrary();check('Library exit works',d.body.textContent.includes('Welcome to Cell Biology!'));w.setPage('home');check('homepage available',d.body.textContent.includes('GCSE'));check('no browser errors',errors.length===0);
}catch(e){rows.push({name:'Harness error: '+e.stack,pass:false});}finally{for(const k of Object.keys(w.localStorage))if(!before.has(k))w.localStorage.removeItem(k);for(const [k,v]of before)w.localStorage.setItem(k,v);}
 out.textContent=JSON.stringify({passed:rows.filter(x=>x.pass).length,total:rows.length,results:rows},null,2);
};
</script>
