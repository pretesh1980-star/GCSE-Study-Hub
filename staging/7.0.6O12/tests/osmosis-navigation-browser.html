<!doctype html><meta charset="utf-8"><title>O9 navigation verification</title><button id="run">Run navigation checks</button><pre id="result">Ready</pre><iframe id="preview" src="../index.html#cell-biology/osmosis" width="390" height="844"></iframe><script>
const f=document.getElementById('preview'),out=document.getElementById('result');
document.getElementById('run').onclick=async()=>{const rows=[],w=f.contentWindow,before=new Map(Object.keys(w.localStorage).map(k=>[k,w.localStorage.getItem(k)])),errors=[];let d=w.document;const check=(name,ok)=>rows.push({name,pass:!!ok}),click=s=>d.querySelector(s).click(),wait=()=>new Promise(r=>setTimeout(r,80));w.addEventListener('error',e=>errors.push(e.message));
try{for(const width of [320,390,768,1365]){f.width=width;w.setPage('home');w.changeChoice('Biology','board','aqa');w.changeScienceCourse('trilogy');w.openLesson('Biology','Cell Biology');w.o9ResetEvidence(w.record('Biology'));const reset=d.createElement('script');reset.textContent="ot={stage:0,resumeStage:0,answers:{},repairs:{},results:{},mode:'immediate'}";d.head.append(reset);w.otSave();w.cellJourneyOpenCard('osmosis');const attempts=w.record('Biology').attempts;
check(width+' new blank learner at stage 1',d.querySelector('#pre').value==='');check(width+' top and bottom controls',d.querySelectorAll('.o9-stage-controls').length===2);check(width+' all six overview buttons',d.querySelectorAll('.o9-stage-overview button').length===6);
for(let n=0;n<6;n++){await wait();check(width+' stage '+(n+1)+' visible heading',d.querySelector('#ot-title').getBoundingClientRect().top>=0&&d.querySelector('#ot-title').getBoundingClientRect().top<844);check(width+' stage '+(n+1)+' no overflow',d.documentElement.scrollWidth<=d.documentElement.clientWidth+1);check(width+' stage '+(n+1)+' current overview',d.querySelector('[aria-current=step]').getAttribute('onclick')==='o9StageGo('+n+')');if(n===0)check(width+' inline film reachable',!!d.querySelector('video'));if(n===1)check(width+' cell activity reachable',!!d.querySelector('.o9-cells'));if(n===2)for(const v of [10,0,-10]){click('button[onclick="o9GraphShow('+v+')"]');check(width+' graph example '+v,d.querySelector('#o9-graph-story').textContent.includes((10+v/10)+' g'));}if(n<5)click('.o9-stage-controls button[onclick="otNext()"]');}
check(width+' navigation never completes benchmark',!w.localStorage.getItem('gcseStudyHub-staging-706L-osmosis-v1').includes('completedAt'));check(width+' navigation earns no mastery',w.cellJourneyEvidence('osmosis').score===null&&w.record('Biology').attempts===attempts);
click('button[onclick="o9StageGo(2)"]');check(width+' overview reaches graph',!!d.querySelector('.o9-graph'));click('.o9-stage-controls button[onclick="otBack()"]');check(width+' Previous reaches stage 2',d.querySelector('#ot-title').textContent==='Explore the membrane');const input=d.querySelector('#prediction');if(input){input.value='Saved idea';input.dispatchEvent(new w.Event('input',{bubbles:true}));}click('.o9-stage-controls button[onclick="otNext()"]');await new Promise(r=>{f.onload=r;f.src='../index.html?navigation-return='+width+'#cell-biology/osmosis-lab'});d=w.document;w.addEventListener('error',e=>errors.push(e.message));check(width+' returning learner resumes graph',!!d.querySelector('.o9-graph'));click('button[onclick="o9StageGo(1)"]');if(input)check(width+' saved explanation survives',d.querySelector('#prediction').value==='Saved idea');click('button[onclick="o9StageGo(5)"]');click('.o9-stage-controls button[onclick="o9CheckStart()"]');check(width+' independent check reachable and hides navigation',!!d.querySelector('#o9-check-title')&&!d.querySelector('.o9-stage-overview'));w.o9CheckSubmit();check(width+' unanswered check cannot score',!w.o9Data().check.done);w.o9CheckBack();}
check('no browser errors',errors.length===0);
}catch(e){check('Harness error '+e.stack,false)}finally{for(const k of Object.keys(w.localStorage))if(!before.has(k))w.localStorage.removeItem(k);for(const[k,v]of before)w.localStorage.setItem(k,v)}out.textContent=JSON.stringify({passed:rows.filter(x=>x.pass).length,total:rows.length,results:rows},null,2);};
</script>
