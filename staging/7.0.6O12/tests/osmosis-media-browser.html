<!doctype html><meta charset="utf-8"><title>Osmosis media verification</title><button id="run">Test original media playback</button><pre id="result">Ready: each original film will attempt playback; no learner progress is changed.</pre><div id="players"></div><script>
run.onclick=async()=>{const rows=[];for(const file of ['osmosis-explainer-clear-subtitles.mp4','osmosis-explainer-narrated.mp4','osmosis-explainer.mp4']){const v=document.createElement('video');v.controls=true;v.playsInline=true;v.width=540;v.src='../media/'+file;players.append(v);const row={file};try{await Promise.race([v.play(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('Playback timeout')),8000))]);await new Promise(r=>setTimeout(r,1500));row.currentTime=v.currentTime;row.width=v.videoWidth;row.height=v.videoHeight;row.decodedFrames=v.getVideoPlaybackQuality?.().totalVideoFrames;row.audioTracks=v.audioTracks?.length;row.played=v.currentTime>1&&v.videoWidth>0;v.pause();}catch(e){row.played=false;row.error=e.message;row.mediaError=v.error?.code;}rows.push(row);result.textContent=JSON.stringify(rows,null,2);}const res=await fetch('../media/osmosis-narrated.vtt');const text=await res.text();rows.push({captionFileStatus:res.status,vttHeader:text.startsWith('WEBVTT'),cueCount:(text.match(/-->/g)||[]).length,note:'Captions are burned into the clear-subtitles film; VTT is preserved as source, not a duplicate native overlay. Audibility and readable subtitles require successful film playback.'});result.textContent=JSON.stringify(rows,null,2);};
</script>
